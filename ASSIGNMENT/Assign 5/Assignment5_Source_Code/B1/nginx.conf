# /etc/nginx/conf.d/portal.conf
upstream portal_app {
    least_conn;
    server 10.20.1.11:8000 max_fails=3 fail_timeout=10s;
    server 10.20.1.12:8000 max_fails=3 fail_timeout=10s;
}
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

server {
    listen 80;
    server_name results.university.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name results.university.example;
    ssl_certificate     /etc/letsencrypt/live/results.university.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/results.university.example/privkey.pem;
    location /static/ { alias /opt/portal/static/; expires 1h; }
    location /login   { limit_req zone=login burst=20 nodelay; proxy_pass http://portal_app; }
    location /        {
        proxy_pass http://portal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
