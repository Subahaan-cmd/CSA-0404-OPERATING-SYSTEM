# site.yml - fragment of the playbook
- hosts: portal_servers
  become: true
  tasks:
    - name: Create the service account
      user: {name: portal, system: true, shell: /usr/sbin/nologin, create_home: false}
    - name: Install packages
      apt: {name: [nginx, python3-venv, ufw, fail2ban], state: present, update_cache: true}
    - name: Install the portal unit
      template: {src: portal.service.j2, dest: /etc/systemd/system/portal.service}
      notify: restart portal
    - name: Allow HTTPS
      ufw: {rule: allow, port: "443", proto: tcp}
  handlers:
    - name: restart portal
      systemd: {name: portal, state: restarted, daemon_reload: true}
