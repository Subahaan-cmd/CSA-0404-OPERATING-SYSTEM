# hpa.yaml: scale the portal between 3 and 50 pods at 60 percent average CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result-portal
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: result-portal}
  minReplicas: 3
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 60}
